services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - STORAGE_DIR=/data
      - CORS_ORIGINS=http://localhost:5173
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - clipsese_data:/data
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - api
volumes:
  clipsese_data:
